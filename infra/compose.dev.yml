# Environnement de développement. Usage : make up (lit app/.env).
# Aucun secret ici : toutes les valeurs viennent de app/.env (voir app/.env.example).
name: votalis

services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    volumes:
      - ../app:/var/www/app
    environment:
      APP_ENV: local
      DB_HOST: db
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      EMBEDDINGS_URL: http://embeddings:8000
      MEILISEARCH_HOST: http://meilisearch:7700
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Traite les files Redis (embeddings, regroupement des conditions, indexation Meilisearch).
  worker:
    build:
      context: ./docker/php
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=2", "--max-time=3600"]
    volumes:
      - ../app:/var/www/app
    environment:
      APP_ENV: local
      DB_HOST: db
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      EMBEDDINGS_URL: http://embeddings:8000
      MEILISEARCH_HOST: http://meilisearch:7700
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ../app:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-votalis}
      POSTGRES_USER: ${DB_USERNAME:-votalis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans app/.env}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-votalis} -d ${DB_DATABASE:-votalis}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY manquant dans app/.env}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    ports:
      - "${MEILISEARCH_PORT_HOST:-7700}:7700"
    volumes:
      - meili-data:/meili_data

  embeddings:
    build:
      context: ../consensus
    # Aucun port publié vers l'hôte en production ; en développement, 8001 permet d'appeler
    # le service depuis les commandes Artisan et les tests lancés sur l'hôte.
    ports:
      - "${EMBEDDINGS_PORT_HOST:-8001}:8000"

  node:
    image: node:22-alpine
    working_dir: /var/www/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../app:/var/www/app
    ports:
      - "5173:5173"

volumes:
  db-data:
  meili-data:
