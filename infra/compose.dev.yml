# Environnement de développement. Usage : make up (lit app/.env).
# Aucun secret ici : toutes les valeurs viennent de app/.env (voir app/.env.example).
name: votalis

services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    volumes:
      - ../app:/var/www/app
    environment:
      APP_ENV: local
      DB_HOST: db
      REDIS_HOST: redis
      MAIL_HOST: mailpit
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ../app:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-votalis}
      POSTGRES_USER: ${DB_USERNAME:-votalis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans app/.env}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-votalis} -d ${DB_DATABASE:-votalis}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  node:
    image: node:22-alpine
    working_dir: /var/www/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../app:/var/www/app
    ports:
      - "5173:5173"

volumes:
  db-data:
