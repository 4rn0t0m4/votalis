# Production : docker compose -f infra/compose.prod.yml --env-file /etc/votalis/app.env up -d
# Aucun secret ici. Seul `web` est joignable, sur l'interface locale, derrière le reverse proxy TLS
# de l'hôte (Caddy, Traefik ou nginx). Tout le reste vit dans le réseau privé du compose (CDC 12).
name: votalis

x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE manquant (image construite par infra/docker/php/Dockerfile.prod)}
  env_file: ${APP_ENV_FILE:-/etc/votalis/app.env}
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_HOST: db
    REDIS_HOST: redis
    EMBEDDINGS_URL: http://embeddings:8000
    MEILISEARCH_HOST: http://meilisearch:7700
    APP_COMMIT: ${APP_COMMIT:-}
  volumes:
    - app-storage:/var/www/app/storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  app:
    <<: *app

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=2", "--max-time=3600"]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - app-public:/var/www/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-votalis}
      POSTGRES_USER: ${DB_USERNAME:-votalis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-votalis} -d ${DB_DATABASE:-votalis}"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY manquant}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped

  embeddings:
    image: ${EMBEDDINGS_IMAGE:?EMBEDDINGS_IMAGE manquant (image construite depuis consensus/)}
    environment:
      TRANSFORMERS_OFFLINE: "1"
    restart: unless-stopped

volumes:
  db-data:
  meili-data:
  app-storage:
  # Fichiers publics (build Vite) copiés de l'image applicative au démarrage : voir docs/exploitation.md.
  app-public:
