# Journal d'accès sans adresse IP ni agent utilisateur (CDC 12 : journaux sans données personnelles).
log_format sans_ip '$time_iso8601 "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    root /var/www/app/public;
    index index.php;

    server_tokens off;
    client_max_body_size 12m;
    access_log /dev/stdout sans_ip;

    # Les en-têtes de sécurité applicatifs (CSP, HSTS…) sont posés par Laravel : une seule source.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(css|js|woff2?|svg|png|jpg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
